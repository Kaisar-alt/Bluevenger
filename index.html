<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030712">
<title>BlueVenger — Biblioteca</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
</script>
<style>
:root{--bg:#030712;--surface:#0b1329;--surface2:#0f172a;--glass:rgba(11,19,41,.78);--border:#1e293b;--text:#f8fafc;--muted:#94a3b8;--primary:#3b82f6;--primary2:#1d4ed8;--radius:16px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}
body{background-image:radial-gradient(circle at 50% 0%,#1e1b4b 0%,#030712 55%)}button,input,select{font:inherit}button{cursor:pointer;color:inherit;border:0}
header{position:sticky;top:0;z-index:30;background:#030712d1;backdrop-filter:blur(18px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-weight:900;font-size:20px;display:flex;align-items:center;gap:9px;background:linear-gradient(90deg,#60a5fa,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.header-actions{display:flex;align-items:center;gap:10px}.lang-selector{position:relative}
.lang-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:10px;font-weight:700;font-size:12px;display:flex;gap:6px;align-items:center}
.lang-menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 30px #0008;display:none;overflow:hidden;z-index:50;min-width:175px}.lang-menu.show{display:flex;flex-direction:column}
.lang-menu button{background:transparent;color:var(--text);padding:11px 14px;text-align:left;font-size:12px;font-weight:600}.lang-menu button:hover{background:#3b82f626}
main{max-width:1100px;margin:auto;padding:20px 16px 40px}.hero{padding:12px 0 18px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px}.hero h1{margin:0;font-size:29px}.hero p{margin:5px 0 0;color:var(--muted);font-size:14px}
.top-nav{display:flex;gap:4px;background:#0f172aa6;padding:4px;border-radius:12px;border:1px solid var(--border)}.top-nav button{background:transparent;padding:7px 12px;border-radius:8px;color:var(--muted);font-weight:700;font-size:12px}.top-nav button.active{background:var(--primary);color:#fff}
.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));padding:11px 18px;border-radius:12px;font-weight:800;color:#fff;box-shadow:0 5px 18px #3b82f633}.field{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:12px;outline:none}.field:focus{border-color:var(--primary)}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.search{flex:1;min-width:190px}.select{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:11px 13px;border-radius:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:16px}.card{background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:0 10px 30px #0005;display:flex;flex-direction:column;transition:.2s}.card:hover{transform:translateY(-3px)}
.cover{height:190px;background:linear-gradient(145deg,#111827,#090d19);display:grid;place-items:center;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.cover-icon{font-size:42px}.cardbody{padding:13px;display:flex;flex-direction:column;flex:1}.title{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px;color:var(--muted);margin-top:5px}.actions{display:flex;gap:7px;margin-top:auto;padding-top:11px}.small{flex:1;background:#1e293bb3;padding:8px;border-radius:9px;font-size:12px;font-weight:700;text-align:center;border:1px solid #ffffff0d}.danger{color:#fca5a5;background:#ef44441f;border:1px solid #ef44444d}.favorite{color:#fbbf24;background:#f59e0b1c;border:1px solid #f59e0b44}
.progress{height:5px;background:#172033;border-radius:99px;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#60a5fa);border-radius:99px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 20px;border:2px dashed var(--border);border-radius:var(--radius)}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1}.site-list{display:grid;gap:12px;margin-top:18px}.site{display:flex;align-items:center;gap:12px;background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:var(--radius);padding:14px}.info{flex:1;overflow:hidden}.info strong,.info small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;background:var(--surface2);padding:8px;border-radius:12px 12px 0 0;border:1px solid var(--border);border-bottom:0}.toolbar button{background:#1e293b;padding:6px 11px;border-radius:7px;font-weight:700;color:#cbd5e1}.rich-editor{min-height:180px;border-radius:0 0 12px 12px;overflow:auto;line-height:1.6;background:var(--surface2);padding:14px;outline:none}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#1e293b;border:1px solid #334155;color:#fff;padding:12px 19px;border-radius:12px;opacity:0;transition:.3s;z-index:200;pointer-events:none;box-shadow:0 10px 30px #0008;font-size:14px;font-weight:600}.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:#030712cc;backdrop-filter:blur(9px);z-index:100;display:none;align-items:center;justify-content:center}.modal.show{display:flex}.sheet{width:min(500px,92%);max-height:90vh;overflow:auto;background:#0b1329;border:1px solid var(--border);padding:23px;border-radius:20px;box-shadow:0 25px 60px #0009}
.reader{position:fixed;inset:0;background:#020617;z-index:90;display:none;flex-direction:column}.reader.show{display:flex}.readerbar{height:60px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#030712eb;backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
.viewer{flex:1;overflow:auto;display:flex;justify-content:center;padding:18px;background:#020617}.pages{display:flex;flex-direction:column;align-items:center;gap:15px;width:100%}.pages canvas{max-width:100%;box-shadow:0 10px 40px #000a;border-radius:3px;background:#fff}.reader-tools{display:flex;gap:6px}.reader-tools button{background:#1e293b;padding:7px 10px;border-radius:8px;font-weight:700}
@media(max-width:650px){header{padding:10px}.brand{font-size:17px}.top-nav button{padding:7px 8px}main{padding:16px 12px}.hero h1{font-size:25px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.cover{height:170px}.cardbody{padding:10px}.small{font-size:11px;padding:8px 5px}}
</style>
</head>
<body>
<header>
<div class="brand">📘 BlueVenger</div>
<div class="header-actions">
<nav class="top-nav">
<button id="navLib" class="active" onclick="switchTab('libraryPage')" data-i18n="navLib">Biblioteca</button>
<button id="navSites" onclick="switchTab('sitesPage')" data-i18n="navSites">Sites</button>
<button id="navNotes" onclick="switchTab('notesPage')" data-i18n="navNotes">Notas</button>
</nav>
<div class="lang-selector">
<button id="langBtn" class="lang-btn" onclick="toggleLangMenu()" aria-haspopup="true" aria-expanded="false">
<span id="currentFlag">🇧🇷</span><span id="currentLangLabel">PT-BR</span> ▾
</button>
<div id="langMenu" class="lang-menu">
<button onclick="setLanguage('pt-BR')">🇧🇷 Português (Brasil)</button>
<button onclick="setLanguage('es-MX')">🇲🇽 Español (México)</button>
</div>
</div>
</div>
</header>

<main>
<section id="libraryPage">
<div class="hero"><div><h1 data-i18n="libTitle">Biblioteca</h1><p data-i18n="libDesc">Seus documentos organizados e disponíveis offline.</p></div><button class="primary" onclick="openAddModal()" data-i18n="newPdf">＋ Novo PDF</button></div>
<div class="controls"><input id="bookSearch" class="field search" placeholder="🔎 Buscar por nome..." data-i18n-placeholder="searchPlaceholder" oninput="renderBooks()"><select id="bookSort" class="select" onchange="renderBooks()"><option value="recent" data-i18n="sortRecent">Mais recentes</option><option value="name" data-i18n="sortName">Nome A–Z</option><option value="progress" data-i18n="sortProgress">Mais lidos</option><option value="favorite" data-i18n="sortFavorite">Favoritos</option></select></div>
<div id="grid" class="grid"></div>
</section>

<section id="sitesPage" style="display:none">
<div class="hero"><div><h1 data-i18n="sitesTitle">Links Rápidos</h1><p data-i18n="sitesDesc">Acesse suas ferramentas favoritas.</p></div></div>
<div class="row"><input id="siteName" class="field" placeholder="Nome do site" data-i18n-placeholder="siteNamePlaceholder"><input id="siteUrl" class="field" placeholder="https://..." data-i18n-placeholder="siteUrlPlaceholder"><button class="primary" onclick="addSite()" data-i18n="saveLink">Salvar Link</button></div>
<div id="sites" class="site-list"></div>
</section>

<section id="notesPage" style="display:none">
<div class="hero"><div><h1 data-i18n="notesTitle">Anotações</h1><p data-i18n="notesDesc">Organize suas ideias e estudos.</p></div></div>
<input id="noteTitleInput" class="field" placeholder="Título da nota" data-i18n-placeholder="noteTitlePlaceholder" style="margin-bottom:8px">
<div class="toolbar"><button onclick="execNote('bold')"><b>B</b></button><button onclick="execNote('italic')"><i>I</i></button><button onclick="execNote('underline')"><u>U</u></button><button onclick="execNote('insertUnorderedList')" data-i18n="bulletList">• Lista</button><button onclick="execNote('removeFormat')" data-i18n="clearFormat">Limpar</button></div>
<div id="noteContentInput" class="rich-editor" contenteditable="true"></div>
<button class="primary" style="width:100%;margin-top:12px" onclick="saveNote()" data-i18n="saveNote">Salvar Anotação</button>
<div id="notesContainer" class="site-list"></div>
</section>
</main>

<div id="addModal" class="modal">
<div class="sheet">
<h2 data-i18n="modalAddPdfTitle">Adicionar PDF</h2>
<label data-i18n="customTitleLabel">Título personalizado</label>
<input id="bookTitle" class="field" placeholder="Opcional" data-i18n-placeholder="customTitlePlaceholder" style="margin:8px 0 14px">
<label data-i18n="pdfFileLabel">Arquivo PDF</label>
<input id="pdfFile" class="field" type="file" accept="application/pdf" style="padding:10px;margin:8px 0 20px">
<div style="display:flex;gap:10px"><button class="primary" style="flex:1" onclick="savePdfToLibrary()" data-i18n="add">Adicionar</button><button class="danger" style="padding:11px 18px;border-radius:12px;font-weight:700" onclick="closeAddModal()" data-i18n="cancel">Cancelar</button></div>
</div></div>

<div id="reader" class="reader">
<div class="readerbar"><button class="reader-tools" onclick="closeReader()" aria-label="Fechar">‹</button><div id="readerName" style="flex:1;text-align:center;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
<div class="reader-tools"><button onclick="changeZoom(-.15)" aria-label="Diminuir zoom">−</button><button onclick="changeZoom(.15)" aria-label="Aumentar zoom">＋</button><button onclick="fitWidth()" aria-label="Ajustar largura">↔</button></div>
<div id="pageCounter" style="color:#60a5fa;font-size:12px;font-weight:800;min-width:48px;text-align:right">1 / 1</div></div>
<div class="viewer" id="viewer"><div class="pages" id="pages"></div></div>
</div>
<div id="toast" class="toast"></div>

<script>
'use strict';

const translations={
'pt-BR':{
navLib:'Biblioteca',navSites:'Sites',navNotes:'Notas',libTitle:'Biblioteca',libDesc:'Seus documentos organizados e disponíveis offline.',newPdf:'＋ Novo PDF',
searchPlaceholder:'🔎 Buscar por nome...',sortRecent:'Mais recentes',sortName:'Nome A–Z',sortProgress:'Mais lidos',sortFavorite:'Favoritos',
emptyBooks:'Nenhum PDF encontrado.',emptySites:'Nenhum site salvo.',emptyNotes:'Nenhuma anotação salva.',sitesTitle:'Links Rápidos',sitesDesc:'Acesse suas ferramentas favoritas.',
siteNamePlaceholder:'Nome do site',siteUrlPlaceholder:'https://...',saveLink:'Salvar Link',notesTitle:'Anotações',notesDesc:'Organize suas ideias e estudos.',
noteTitlePlaceholder:'Título da nota',bulletList:'• Lista',clearFormat:'Limpar',saveNote:'Salvar Anotação',
modalAddPdfTitle:'Adicionar PDF',customTitleLabel:'Título personalizado',customTitlePlaceholder:'Opcional',pdfFileLabel:'Arquivo PDF',add:'Adicionar',cancel:'Cancelar',
access:'Acessar',delete:'Excluir',edit:'Editar',read:'Ler',pageText:'Página',ofText:'de',completedText:'concluído',
toastSelectPdf:'Selecione um arquivo PDF!',toastNotPdf:'O arquivo precisa ser PDF.',toastProcessing:'Processando PDF...',toastPdfAdded:'PDF adicionado com sucesso!',
toastSaveError:'Erro ao salvar o PDF.',toastDeleteError:'Erro ao excluir o PDF.',toastPdfNotFound:'Arquivo PDF não encontrado.',toastOpenError:'Não foi possível abrir o PDF.',
toastLinkSaved:'Link salvo!',toastFillFields:'Preencha nome e URL!',toastNoteEmpty:'Escreva algo na nota!',toastNoteSaved:'Anotação salva!',toastDb:'Não foi possível abrir o armazenamento local.',
toastLocalPdf:'PDF salvo, mas este navegador não permite armazenamento persistente de arquivos neste modo. Abra o HTML por um servidor local ou hospede o site para guardar PDFs.'
},
'es-MX':{
navLib:'Biblioteca',navSites:'Sitios',navNotes:'Notas',libTitle:'Biblioteca',libDesc:'Tus documentos organizados y disponibles sin conexión.',newPdf:'＋ Nuevo PDF',
searchPlaceholder:'🔎 Buscar por nombre...',sortRecent:'Más recientes',sortName:'Nombre A–Z',sortProgress:'Más leídos',sortFavorite:'Favoritos',
emptyBooks:'No se encontró ningún PDF.',emptySites:'No hay sitios guardados.',emptyNotes:'No hay notas guardadas.',sitesTitle:'Enlaces rápidos',sitesDesc:'Accede a tus herramientas favoritas.',
siteNamePlaceholder:'Nombre del sitio',siteUrlPlaceholder:'https://...',saveLink:'Guardar enlace',notesTitle:'Notas',notesDesc:'Organiza tus ideas y estudios.',
noteTitlePlaceholder:'Título de la nota',bulletList:'• Lista',clearFormat:'Limpiar',saveNote:'Guardar nota',
modalAddPdfTitle:'Agregar PDF',customTitleLabel:'Título personalizado',customTitlePlaceholder:'Opcional',pdfFileLabel:'Archivo PDF',add:'Agregar',cancel:'Cancelar',
access:'Abrir',delete:'Eliminar',edit:'Editar',read:'Leer',pageText:'Página',ofText:'de',completedText:'completado',
toastSelectPdf:'¡Selecciona un archivo PDF!',toastNotPdf:'El archivo debe ser PDF.',toastProcessing:'Procesando PDF...',toastPdfAdded:'¡PDF agregado correctamente!',
toastSaveError:'Error al guardar el PDF.',toastDeleteError:'Error al eliminar el PDF.',toastPdfNotFound:'No se encontró el archivo PDF.',toastOpenError:'No se pudo abrir el PDF.',
toastLinkSaved:'¡Enlace guardado!',toastFillFields:'¡Completa el nombre y la URL!',toastNoteEmpty:'¡Escribe algo en la nota!',toastNoteSaved:'¡Nota guardada!',toastDb:'No se pudo abrir el almacenamiento local.',
toastLocalPdf:'El PDF se guardó, pero este navegador no permite almacenamiento persistente de archivos en este modo. Abre el HTML mediante un servidor local o publica el sitio para guardar PDFs.'
}};

let currentLang=localStorage.getItem('bluevenger_lang')||'pt-BR';
let db=null,books=[],sites=[],notes=[],currentEditNoteId=null,pdfDoc=null,pageObserver=null,currentBookId=null,scale=1,storageMode='idb';

const $=id=>document.getElementById(id);
const t=k=>translations[currentLang]?.[k]||translations['pt-BR'][k]||k;

function showToast(m){const x=$('toast');x.textContent=m;x.classList.add('show');clearTimeout(x._timer);x._timer=setTimeout(()=>x.classList.remove('show'),3000)}
function toggleLangMenu(){const m=$('langMenu'),b=$('langBtn');m.classList.toggle('show');b.setAttribute('aria-expanded',m.classList.contains('show'))}
window.addEventListener('click',e=>{if(!e.target.closest('.lang-selector')){$('langMenu').classList.remove('show');$('langBtn').setAttribute('aria-expanded','false')}});

function setLanguage(lang){
  if(!translations[lang])lang='pt-BR';
  currentLang=lang;localStorage.setItem('bluevenger_lang',lang);
  $('currentFlag').textContent=lang==='es-MX'?'🇲🇽':'🇧🇷';
  $('currentLangLabel').textContent=lang==='es-MX'?'ES-MX':'PT-BR';
  $('langMenu').classList.remove('show');$('langBtn').setAttribute('aria-expanded','false');
  document.documentElement.lang=lang;
  document.title=lang==='es-MX'?'BlueVenger — Biblioteca':'BlueVenger — Biblioteca';
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-placeholder]').forEach(e=>e.placeholder=t(e.dataset.i18nPlaceholder));
  renderBooks();renderSites();renderNotes();
}

function openDB(){
 return new Promise(resolve=>{
  if(!('indexedDB' in window)){storageMode='local';return resolve(null)}
  let settled=false,finish=v=>{if(!settled){settled=true;resolve(v)}};
  let r;try{r=indexedDB.open('BlueVengerDB',10)}catch(e){storageMode='local';return finish(null)}
  r.onupgradeneeded=e=>{const d=e.target.result;for(const s of ['books','pdfs','sites','notes'])if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})};
  r.onsuccess=e=>{db=e.target.result;db.onversionchange=()=>db.close();storageMode='idb';finish(db)};
  r.onerror=()=>{storageMode='local';finish(null)};r.onblocked=()=>{storageMode='local';finish(null)};
  setTimeout(()=>{if(!settled){storageMode='local';finish(null)}},3500)
 })
}
function localGet(key,def=[]){try{return JSON.parse(localStorage.getItem('bluevenger_'+key)||'null')??def}catch(e){return def}}
function localSet(key,val){try{localStorage.setItem('bluevenger_'+key,JSON.stringify(val));return true}catch(e){return false}}

function switchTab(id){
 ['libraryPage','sitesPage','notesPage'].forEach(p=>$(p).style.display=p===id?'block':'none');
 $('navLib').className=id==='libraryPage'?'active':'';
 $('navSites').className=id==='sitesPage'?'active':'';
 $('navNotes').className=id==='notesPage'?'active':'';
}
function openAddModal(){$('addModal').classList.add('show')}
function closeAddModal(){$('addModal').classList.remove('show')}

function loadSites(){
 if(storageMode==='local'){sites=localGet('sites',[]).reverse();return renderSites()}
 try{const r=db.transaction('sites').objectStore('sites').getAll();r.onsuccess=()=>{sites=(r.result||[]).reverse();renderSites()};r.onerror=()=>{sites=localGet('sites',[]).reverse();renderSites()}}catch(e){sites=localGet('sites',[]).reverse();renderSites()}
}
function addSite(){
 const name=$('siteName').value.trim();let url=$('siteUrl').value.trim();
 if(!name||!url)return showToast(t('toastFillFields'));if(!/^https?:\/\//i.test(url))url='https://'+url;
 const item={id:'site_'+Date.now()+'_'+Math.random().toString(36).slice(2),name,url};
 if(storageMode==='local'){sites.unshift(item);if(!localSet('sites',sites.slice().reverse()))return showToast(t('toastDb'));$('siteName').value='';$('siteUrl').value='';renderSites();showToast(t('toastLinkSaved'));return}
 try{const tx=db.transaction('sites','readwrite');tx.objectStore('sites').put(item);tx.oncomplete=()=>{$('siteName').value='';$('siteUrl').value='';loadSites();showToast(t('toastLinkSaved'))};tx.onerror=()=>{sites.unshift(item);localSet('sites',sites.slice().reverse());renderSites();showToast(t('toastLinkSaved'))}}catch(e){sites.unshift(item);localSet('sites',sites.slice().reverse());renderSites();showToast(t('toastLinkSaved'))}
}
function deleteSite(id){
 if(storageMode==='local'){sites=sites.filter(s=>s.id!==id);localSet('sites',sites.slice().reverse());return renderSites()}
 try{const tx=db.transaction('sites','readwrite');tx.objectStore('sites').delete(id);tx.oncomplete=loadSites;tx.onerror=()=>{sites=sites.filter(s=>s.id!==id);localSet('sites',sites.slice().reverse());renderSites()}}catch(e){sites=sites.filter(s=>s.id!==id);localSet('sites',sites.slice().reverse());renderSites()}
}
function renderSites(){
 const c=$('sites');if(!sites.length){c.innerHTML=`<div class="empty">${t('emptySites')}</div>`;return}
 c.innerHTML=sites.map(s=>`<div class="site"><div class="info"><strong>${escapeHTML(s.name)}</strong><small>${escapeHTML(s.url)}</small></div><button class="primary small" onclick="openSite('${safeJS(s.url)}')">${t('access')}</button><button class="danger small" onclick="deleteSite('${safeJS(s.id)}')">${t('delete')}</button></div>`).join('')
}
function openSite(url){window.open(url,'_blank','noopener,noreferrer')}

function execNote(c){document.execCommand(c,false,null);$('noteContentInput').focus()}
function loadNotes(){
 if(storageMode==='local'){notes=localGet('notes',[]).reverse();return renderNotes()}
 try{const r=db.transaction('notes').objectStore('notes').getAll();r.onsuccess=()=>{notes=(r.result||[]).reverse();renderNotes()};r.onerror=()=>{notes=localGet('notes',[]).reverse();renderNotes()}}catch(e){notes=localGet('notes',[]).reverse();renderNotes()}
}
function saveNote(){
 const title=$('noteTitleInput').value.trim(),content=$('noteContentInput').innerHTML.trim();if(!title&&!content)return showToast(t('toastNoteEmpty'));
 const id=currentEditNoteId||'note_'+Date.now()+'_'+Math.random().toString(36).slice(2),item={id,title:title||(currentLang==='es-MX'?'Sin título':'Sem Título'),content,updatedAt:Date.now()};
 if(storageMode==='local'){const arr=localGet('notes',[]).filter(n=>n.id!==id);arr.push(item);if(!localSet('notes',arr))return showToast(t('toastDb'));finishNoteSave();return}
 try{const tx=db.transaction('notes','readwrite');tx.objectStore('notes').put(item);tx.oncomplete=()=>finishNoteSave();tx.onerror=()=>{const arr=localGet('notes',[]).filter(n=>n.id!==id);arr.push(item);localSet('notes',arr);finishNoteSave()}}catch(e){const arr=localGet('notes',[]).filter(n=>n.id!==id);arr.push(item);localSet('notes',arr);finishNoteSave()}
}
function finishNoteSave(){currentEditNoteId=null;$('noteTitleInput').value='';$('noteContentInput').innerHTML='';loadNotes();showToast(t('toastNoteSaved'))}
function editNote(id){const n=notes.find(x=>x.id===id);if(!n)return;currentEditNoteId=id;$('noteTitleInput').value=n.title;$('noteContentInput').innerHTML=n.content;switchTab('notesPage');scrollTo({top:0,behavior:'smooth'})}
function deleteNote(id){
 if(storageMode==='local'){notes=notes.filter(n=>n.id!==id);localSet('notes',notes.slice().reverse());if(currentEditNoteId===id)currentEditNoteId=null;return renderNotes()}
 try{const tx=db.transaction('notes','readwrite');tx.objectStore('notes').delete(id);tx.oncomplete=()=>{if(currentEditNoteId===id)currentEditNoteId=null;loadNotes()};tx.onerror=()=>{notes=notes.filter(n=>n.id!==id);localSet('notes',notes.slice().reverse());renderNotes()}}catch(e){notes=notes.filter(n=>n.id!==id);localSet('notes',notes.slice().reverse());renderNotes()}
}
function renderNotes(){
 const c=$('notesContainer');if(!notes.length){c.innerHTML=`<div class="empty">${t('emptyNotes')}</div>`;return}
 c.innerHTML=notes.map(n=>`<div class="site" style="flex-direction:column;align-items:stretch"><strong>${escapeHTML(n.title)}</strong><div style="background:#030712;padding:12px;border-radius:10px;margin-top:8px;font-size:14px;overflow:auto">${n.content}</div><div style="display:flex;gap:8px;margin-top:12px"><button class="primary small" onclick="editNote('${safeJS(n.id)}')">✏️ ${t('edit')}</button><button class="danger small" onclick="deleteNote('${safeJS(n.id)}')">${t('delete')}</button></div></div>`).join('')
}

function loadBooks(){
 if(storageMode==='local'){books=localGet('books',[]).map(b=>({currentPage:1,totalPages:1,favorite:false,...b}));return renderBooks()}
 try{const r=db.transaction('books').objectStore('books').getAll();r.onsuccess=()=>{books=(r.result||[]).map(b=>({currentPage:1,totalPages:1,favorite:false,...b}));renderBooks()};r.onerror=()=>{books=localGet('books',[]).map(b=>({currentPage:1,totalPages:1,favorite:false,...b}));renderBooks()}}catch(e){books=localGet('books',[]).map(b=>({currentPage:1,totalPages:1,favorite:false,...b}));renderBooks()}
}
function progress(b){const total=Math.max(1,b.totalPages||1),page=Math.min(total,Math.max(1,b.currentPage||1));return Math.round(page/total*100)}
function persistBook(b){
 if(storageMode==='local'){const arr=localGet('books',[]).filter(x=>x.id!==b.id);arr.push(b);localSet('books',arr);return}
 try{const tx=db.transaction('books','readwrite');tx.objectStore('books').put(b);tx.onerror=()=>{const arr=localGet('books',[]).filter(x=>x.id!==b.id);arr.push(b);localSet('books',arr)}}catch(e){const arr=localGet('books',[]).filter(x=>x.id!==b.id);arr.push(b);localSet('books',arr)}
}
function toggleFavorite(id){const b=books.find(x=>x.id===id);if(!b)return;b.favorite=!b.favorite;b.updatedAt=Date.now();persistBook(b);renderBooks()}
function renderBooks(){
 const q=($('bookSearch').value||'').toLowerCase().trim(),sort=$('bookSort').value;let list=books.filter(b=>String(b.title||'').toLowerCase().includes(q));
 if(sort==='name')list.sort((a,b)=>String(a.title).localeCompare(String(b.title),'pt-BR'));else if(sort==='progress')list.sort((a,b)=>progress(b)-progress(a));else if(sort==='favorite')list=list.filter(b=>b.favorite);else list.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
 const c=$('grid');if(!list.length){c.innerHTML=`<div class="empty">${t('emptyBooks')}</div>`;return}
 c.innerHTML=list.map(b=>{const pct=progress(b);return `<div class="card"><div class="cover">${b.cover?`<img src="${b.cover}" alt="">`:'<div class="cover-icon">📄</div>'}</div><div class="cardbody"><div class="title" title="${escapeHTML(b.title)}">${escapeHTML(b.title)}</div><div class="meta">${t('pageText')} ${b.currentPage||1} ${t('ofText')} ${b.totalPages||1}</div><div class="progress"><i style="width:${pct}%"></i></div><div class="meta">${pct}% ${t('completedText')}</div><div class="actions"><button class="primary small" onclick="openReader('${safeJS(b.id)}')">${t('read')}</button><button class="favorite small" onclick="toggleFavorite('${safeJS(b.id)}')">${b.favorite?'★':'☆'}</button><button class="danger small" onclick="deleteBook('${safeJS(b.id)}')">${t('delete')}</button></div></div></div>`}).join('')
}

async function savePdfToLibrary(){
 const file=$('pdfFile').files[0];if(!file)return showToast(t('toastSelectPdf'));if(file.type&&file.type!=='application/pdf'&&!file.name.toLowerCase().endsWith('.pdf'))return showToast(t('toastNotPdf'));showToast(t('toastProcessing'));
 const id='book_'+Date.now()+'_'+Math.random().toString(36).slice(2),title=$('bookTitle').value.trim()||file.name;
 try{
  let pages=1,cover=null;
  if(window.pdfjsLib){try{const probe=await file.arrayBuffer(),temp=await pdfjsLib.getDocument({data:probe,disableWorker:true}).promise;pages=temp.numPages;try{const p=await temp.getPage(1),v=p.getViewport({scale:.35}),cv=document.createElement('canvas');cv.width=Math.ceil(v.width);cv.height=Math.ceil(v.height);await p.render({canvasContext:cv.getContext('2d'),viewport:v}).promise;cover=cv.toDataURL('image/jpeg',.72)}catch(_){}await temp.destroy()}catch(_){}}
  const book={id,title,currentPage:1,totalPages:pages,cover,favorite:false,updatedAt:Date.now()};
  if(storageMode==='local'){const arr=localGet('books',[]);arr.push(book);if(!localSet('books',arr))return showToast(t('toastSaveError'));closeAddModal();$('bookTitle').value='';$('pdfFile').value='';loadBooks();return showToast(t('toastLocalPdf'))}
  await new Promise((resolve,reject)=>{try{const tx=db.transaction(['books','pdfs'],'readwrite');tx.objectStore('books').put(book);tx.objectStore('pdfs').put({id,pdf:file});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('IDB write failed'))}catch(e){reject(e)}});
  $('bookTitle').value='';$('pdfFile').value='';closeAddModal();loadBooks();showToast(t('toastPdfAdded'))
 }catch(e){console.error(e);showToast(t('toastSaveError'))}
}
function deleteBook(id){
 if(!id)return;
 if(storageMode==='local'){books=books.filter(b=>b.id!==id);localSet('books',books);renderBooks();return}
 try{if(currentBookId===id)closeReader();const tx=db.transaction(['books','pdfs'],'readwrite');tx.objectStore('books').delete(id);tx.objectStore('pdfs').delete(id);tx.oncomplete=()=>{books=books.filter(b=>b.id!==id);renderBooks();showToast(currentLang==='es-MX'?'PDF eliminado.':'PDF excluído.')};tx.onerror=()=>showToast(t('toastDeleteError'))}catch(e){showToast(t('toastDeleteError'))}
}
async function openReader(id){
 const book=books.find(b=>b.id===id);if(!book)return;if(!db||storageMode!=='idb')return showToast(t('toastLocalPdf'));
 currentBookId=id;$('readerName').textContent=book.title;$('pageCounter').textContent=`${book.currentPage||1} / ${book.totalPages||1}`;$('reader').classList.add('show');
 const finish=async rec=>{if(!rec)return showToast(t('toastPdfNotFound'));try{let src=rec.pdf;if(src instanceof Blob)src=await src.arrayBuffer();pdfDoc=await pdfjsLib.getDocument({data:src,disableWorker:true}).promise;book.totalPages=pdfDoc.numPages;persistBook(book);await renderPages();const target=$('pages').querySelector(`canvas[data-page="${book.currentPage||1}"]`);if(target)setTimeout(()=>target.scrollIntoView({behavior:'auto',block:'start'}),100)}catch(e){console.error(e);showToast(t('toastOpenError'))}};
 try{const r=db.transaction('pdfs').objectStore('pdfs').get(id);r.onsuccess=()=>finish(r.result);r.onerror=()=>showToast(t('toastOpenError'))}catch(e){showToast(t('toastOpenError'))}
}
function saveCurrentPage(){
 if(!currentBookId||!pdfDoc)return;const canvases=document.querySelectorAll('#pages canvas');let best=null,bestRatio=0,vr=$('viewer').getBoundingClientRect();
 canvases.forEach(c=>{const r=c.getBoundingClientRect(),top=Math.max(r.top,vr.top),bottom=Math.min(r.bottom,vr.bottom),visible=Math.max(0,bottom-top),ratio=visible/Math.max(1,Math.min(r.height,vr.height));if(ratio>bestRatio){bestRatio=ratio;best=c}});
 if(best){const n=+best.dataset.page,b=books.find(x=>x.id===currentBookId);if(b){b.currentPage=n;b.totalPages=pdfDoc.numPages;b.updatedAt=Date.now();persistBook(b);$('pageCounter').textContent=`${n} / ${pdfDoc.numPages}`}}
}
function closeReader(){saveCurrentPage();$('reader').classList.remove('show');$('pages').innerHTML='';if(pageObserver)pageObserver.disconnect();if(pdfDoc){try{pdfDoc.destroy()}catch(_){} }pdfDoc=null;currentBookId=null;loadBooks()}
async function renderPages(){const first=await pdfDoc.getPage(1),base=first.getViewport({scale:1});scale=Math.min(1.4,Math.max(.5,($('viewer').clientWidth-30)/base.width));await renderAll()}
async function renderAll(){const c=$('pages');c.innerHTML='';const dpr=window.devicePixelRatio||1;for(let i=1;i<=pdfDoc.numPages;i++){const p=await pdfDoc.getPage(i),v=p.getViewport({scale}),cv=document.createElement('canvas'),ctx=cv.getContext('2d');cv.dataset.page=i;cv.width=Math.floor(v.width*dpr);cv.height=Math.floor(v.height*dpr);cv.style.width=v.width+'px';cv.style.height=v.height+'px';ctx.scale(dpr,dpr);c.appendChild(cv);await p.render({canvasContext:ctx,viewport:v}).promise}setupPageObserver()}
function setupPageObserver(){if(pageObserver)pageObserver.disconnect();pageObserver=new IntersectionObserver(entries=>{let best=null;entries.forEach(e=>{if(e.isIntersecting&&(!best||e.intersectionRatio>best.intersectionRatio))best=e});if(!best||!pdfDoc)return;const n=+best.target.dataset.page;$('pageCounter').textContent=`${n} / ${pdfDoc.numPages}`;const b=books.find(x=>x.id===currentBookId);if(b&&b.currentPage!==n){b.currentPage=n;b.totalPages=pdfDoc.numPages;b.updatedAt=Date.now();persistBook(b)}},{root:$('viewer'),threshold:[.1,.25,.5,.75]});document.querySelectorAll('#pages canvas').forEach(c=>pageObserver.observe(c))}
function changeZoom(delta){scale=Math.max(.4,Math.min(2.5,scale+delta));renderAll()}
function fitWidth(){if(!pdfDoc)return;pdfDoc.getPage(1).then(p=>{const base=p.getViewport({scale:1});scale=Math.max(.5,Math.min(1.8,($('viewer').clientWidth-30)/base.width));renderAll()})}
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function safeJS(s){return String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
window.addEventListener('resize',()=>{if($('reader').classList.contains('show')&&pdfDoc){clearTimeout(window._resize);window._resize=setTimeout(renderPages,250)}});

window.onload=async()=>{setLanguage(currentLang);await openDB();loadSites();loadNotes();loadBooks()};
window.addEventListener('pagehide',saveCurrentPage);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveCurrentPage()});
</script>
